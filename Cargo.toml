[package]
name = "lucentia"
version = "0.1.0"
edition = "2021"
description = "Capture app for Elgato (and other UVC) capture cards, with full control over how you record"
license = "MIT"
repository = "https://github.com/Daggenthal/Lucentia"
authors = ["Daggenthal"]

[dependencies]
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
libc = "0.2"
ctrlc = "3"
slint = "1.18"
rfd = "0.17"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = true
