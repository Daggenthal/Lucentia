[package]
name = "lucentia"
version = "0.1.0"
edition = "2021"
description = "Capture app for Elgato (and other UVC) capture cards, with full control over how you record"
license = "MIT"
repository = "https://github.com/Daggenthal/Lucentia"
authors = ["Daggenthal"]

[dependencies]
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
libc = "0.2"
# Echo cancellation (WebRTC AEC3, pure Rust, BSD-3-Clause)
sonora = "0.2"
# Global record hotkey through the desktop portal (KDE, GNOME, Hyprland...)
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-util = "0.3"
pollster = "0.4"
ctrlc = "3"
slint = "1.18"
rfd = "0.17"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = true
